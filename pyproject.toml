[project]
name = "changeover-guard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python-headless",
    "pillow",
    "scikit-image",
    "streamlit",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "scipy>=1.17.1",
]

[dependency-groups]
analysis = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
